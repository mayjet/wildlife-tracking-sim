# Farm: MiyotaMtBase（御代田山地放牧研究拠点）
# Address: 〒389-0201 長野県北佐久郡御代田町塩野375-716
# The configured center is used as the selection anchor. The initial rectangle
# is replaced only because confirm_monitoring_boundary is explicitly enabled.

case_id: MiyotaMtBase_gsi_3km_v1
mode: create

terrain:
  source: gsi
  center_lat: 36.35011004721748
  center_lon: 138.4966065945264
  size_m: 3000
  cell_size_m: 5
  missing_data: nearest
  offline: false
  gsi_datasets:
    - dem1a_png
    - dem5a_png
    - dem5b_png
    - dem5c_png
    - dem_png

farm:
  boundary_type: rectangle
  size_m: 2000

detection:
  imagery:
    source: gsi_seamlessphoto
    zoom: 17
    output_cell_size_m: 1
    offline: false

  landcover:
    source: esa_worldcover
    year: 2021
    offline: false

  buildings:
    source: gsi_vector_osm
    overpass_url: https://overpass-api.de/api/interpreter
    gsi_zoom: 16
    assumed_height_m: 5
    offline: false

  pasture:
    open_landcover_classes: [30, 40, 60]
    maximum_slope_deg: 20
    minimum_area_m2: 1000
    bridge_gap_m: 40
    enclosed_hole_maximum_area_m2: null
    facility_maximum_distance_m: 40
    monitoring_closing_m: 120
    monitoring_buffer_m: 10
    selection_anchor_x_m: 0
    selection_anchor_y_m: 0
    confirm_monitoring_boundary: true

  forest_classes: [10, 95]
  forest_minimum_area_m2: 100
  difficult_slope_deg: 35

scene:
  forest_height_m: 10
  forest_boundary_smoothing_m: 5
  crop:
    enabled: true
    source: farm_boundary
    shape: square
    scale: 1.5
    minimum_margin_m: 100
    center_offset_x_m: 0
    center_offset_y_m: 0
    snap_to_terrain_grid: true

cameras: []
