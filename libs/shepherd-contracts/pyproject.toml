[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-contracts"
version = "0.1.0"
description = "Shared schemas and API contracts for the wildlife tracking benchmark"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

