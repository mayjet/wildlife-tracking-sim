[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-campost"
version = "0.1.0"
description = "Fixed camera placement and USD scene export for wildlife tracking cases"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6,<7",
    "shapely>=2,<3",
    "field-environment>=0.1,<0.2",
    "shepherd-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
usd = ["usd-core>=23.11"]
genesis = ["genesis-world"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
