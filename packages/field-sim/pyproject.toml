[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-sim"
version = "0.1.0"
description = "Minimal ground-truth deer simulation for wildlife tracking cases"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "pyarrow>=14,<23",
    "pydantic>=2.5,<3",
    "PyYAML>=6,<7",
    "shapely>=2,<3",
    "field-environment>=0.1,<0.2",
    "field-campost>=0.1,<0.2",
    "shepherd-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
notebook = ["ipympl>=0.9,<1", "ipywidgets>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: accesses an official external terrain service"]
