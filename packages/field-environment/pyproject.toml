[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-environment"
version = "0.1.0"
description = "Terrain generation and case management for the wildlife tracking benchmark"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "Pillow>=10,<13",
    "pydantic>=2.5,<3",
    "pyproj>=3.4,<4",
    "PyYAML>=6,<7",
    "rasterio>=1.3,<2",
    "requests>=2.31,<3",
    "scipy>=1.10,<2",
    "shapely>=2,<3",
    "shepherd-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
alos = ["jaxa-earth>=0.1.6,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: accesses an official external terrain service"]
